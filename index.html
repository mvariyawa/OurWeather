<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hourly Weather</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel    background: #f5f5f5;
}

.weather-list {
    height: 80vh;
    overflow-y: auto;
    background: white;
    border-radius: 8px;
    border: 1px solid #ddd;
}

.weather-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    border-bottom: 1px solid #eee;
}

.weather-row:last-child {
    border-bottom: none;
}

.time {
    width: 160px;
}

.temp {
    font-weight: bold;
}

.loading {
    padding: 15px;
    text-align: center;
    color: #666;
}
</style>
</head>
<body>

<div class="container py-4">
    <h2 class="mb-3">Today's Weather</h2>

    <div class="input-group mb-3">
        <input
            id="address"
            class="form-control"
            placeholder="Enter city or address">
        <button id="searchBtn" class="btn btn-primary">
            Search
        </button>
        <button id="locationBtn" class="btn btn-secondary">
            Use My Location
        </button>
    </div>

    <div id="locationName" class="mb-3 text-muted"></div>

    <div id="weatherList" class="weather-list">
        <div class="loading">Loading...</div>
    </div>
</div>

<script>
let latitude;
let longitude;
let loadedDays = 0;
let loading = false;

const weatherList = document.getElementById("weatherList");
const locationName = document.getElementById("locationName");

function weatherCodeToText(code) {
    const map = {
        0: "Clear",
        1: "Mainly Clear",
        2: "Partly Cloudy",
        3: "Cloudy",
        45: "Fog",
        48: "Fog",
        51: "Drizzle",
        53: "Drizzle",
        55: "Drizzle",
        61: "Rain",
        63: "Rain",
        65: "Heavy Rain",
        71: "Snow",
        73: "Snow",
        75: "Heavy Snow",
        80: "Rain Showers",
        81: "Rain Showers",
        82: "Heavy Showers",
        95: "Thunderstorm"
    };

    return map[code] || "Unknown";
}

function formatDate(date) {
    return date.toISOString().split("T")[0];
}

async function loadWeatherChunk() {

    if (loading) return;
    loading = true;

    try {
        const start = new Date();
        start.setDate(start.getDate() + loadedDays);

        const end = new Date(start);
        end.setDate(end.getDate() + 2);

        const url =
            `https://api.open-meteo.com/v1/forecast` +
            `?latitude=${latitude}` +
            `&longitude=${longitude}` +
            `&hourly=temperature_2m,weather_code` +
            `&timezone=auto` +
            `&start_date=${formatDate(start)}` +
            `&end_date=${formatDate(end)}`;

        const response = await fetch(url);
        const data = await response.json();

        if (loadedDays === 0) {
            weatherList.innerHTML = "";
        }

        const times = data.hourly.time;
        const temps = data.hourly.temperature_2m;
        const codes = data.hourly.weather_code;

        for (let i = 0; i < times.length; i++) {
            const row = document.createElement("div");
            row.className = "weather-row";

            row.innerHTML = `
                <div class="time">${new Date(times[i]).toLocaleString()}</div>
                <div>${weatherCodeToText(codes[i])}</div>
                <div class="temp">${temps[i]}°C</div>
            `;

            weatherList.appendChild(row);
        }

        loadedDays += 3;
    }
    catch (err) {
        console.error(err);
        weatherList.innerHTML =
            "<div class='loading'>Failed to load weather.</div>";
    }

    loading = false;
}

async function searchAddress(query) {

    const response = await fetch(
        `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(query)}`
    );

    const results = await response.json();

    if (!results.length) {
        alert("Location not found");
        return;
    }

    latitude = parseFloat(results[0].lat);
    longitude = parseFloat(results[0].lon);

    locationName.textContent = results[0].display_name;

    loadedDays = 0;
    loadWeatherChunk();
}

async function useCurrentLocation() {

    if (!navigator.geolocation) {
        alert("Geolocation not supported");
        return;
    }

    navigator.geolocation.getCurrentPosition(
        async position => {

            latitude = position.coords.latitude;
            longitude = position.coords.longitude;

            locationName.textContent =
                `Lat ${latitude.toFixed(4)}, Lng ${longitude.toFixed(4)}`;

            loadedDays = 0;
            loadWeatherChunk();
        },
        () => {
            alert("Unable to retrieve location");
        }
    );
}

weatherList.addEventListener("scroll", () => {

    const nearBottom =
        weatherList.scrollTop + weatherList.clientHeight >=
        weatherList.scrollHeight - 300;

    if (nearBottom) {
        loadWeatherChunk();
    }
});

document.getElementById("searchBtn")
    .addEventListener("click", () => {

        const value =
            document.getElementById("address").value.trim();

        if (value) {
            searchAddress(value);
        }
    });

document.getElementById("locationBtn")
    .addEventListener("click", useCurrentLocation);

useCurrentLocation();
</script>

</body>
</html>
